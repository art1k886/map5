    let isSnippingMode = false;
    let isSelectingRect = false;
    let snipStart = { x: 0, y: 0 };
    let snipRect = { x: 0, y: 0, w: 0, h: 0 };

    function startSnippingMode() {
        if (backdrop.classList.contains('open')) closeModal();
        isSnippingMode = true;
        isSelectingRect = false;
        document.body.classList.add('taking-screenshot');
        snipOverlay.classList.add('active');
        snipFullDim.style.display = 'block';
        snipSelectionBox.style.display = 'none';
        snipSizeBadge.style.display = 'none';
    }

    function stopSnippingMode() {
        isSnippingMode = false;
        isSelectingRect = false;
        document.body.classList.remove('taking-screenshot');
        snipOverlay.classList.remove('active');
        snipSelectionBox.style.display = 'none';
        snipSizeBadge.style.display = 'none';
    }

    openSnipBtn.addEventListener('click', startSnippingMode);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isSnippingMode) {
            stopSnippingMode();
        }
        if ((e.altKey && (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы')) || e.key === 'PrintScreen') {
            e.preventDefault();
            startSnippingMode();
        }
    });

    function snipUpdateBox(x, y, w, h) {
        snipRect = { x, y, w, h };
        snipSelectionBox.style.left = `${x}px`;
        snipSelectionBox.style.top = `${y}px`;
        snipSelectionBox.style.width = `${w}px`;
        snipSelectionBox.style.height = `${h}px`;

        if (w > 10 && h > 10) {
            snipSizeBadge.style.display = 'block';
            snipSizeBadge.textContent = `${Math.round(w)} × ${Math.round(h)}`;
            snipSizeBadge.style.left = `${Math.min(window.innerWidth - 90, x)}px`;
            snipSizeBadge.style.top = `${Math.max(8, y - 26)}px`;
        } else {
            snipSizeBadge.style.display = 'none';
        }
    }

    function snipPointerDown(e) {
        if (e.button === 2) {
            stopSnippingMode();
            return;
        }
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (!e.isPrimary) return;

        e.preventDefault();
        isSelectingRect = true;
        snipStart = { x: e.clientX, y: e.clientY };
        snipRect = { x: e.clientX, y: e.clientY, w: 0, h: 0 };

        snipFullDim.style.display = 'none';
        snipSelectionBox.style.display = 'block';
        snipSelectionBox.style.left = `${e.clientX}px`;
        snipSelectionBox.style.top = `${e.clientY}px`;
        snipSelectionBox.style.width = '0px';
        snipSelectionBox.style.height = '0px';

        try { snipOverlay.setPointerCapture(e.pointerId); } catch (_) {}
    }

    function snipPointerMove(e) {
        if (!isSelectingRect) return;
        e.preventDefault();

        const x = Math.min(snipStart.x, e.clientX);
        const y = Math.min(snipStart.y, e.clientY);
        const w = Math.abs(e.clientX - snipStart.x);
        const h = Math.abs(e.clientY - snipStart.y);
        snipUpdateBox(x, y, w, h);
    }

    async function snipPointerUp(e) {
        if (!isSelectingRect) return;
        e.preventDefault();

        try { snipOverlay.releasePointerCapture(e.pointerId); } catch (_) {}

        const rect = { ...snipRect };
        stopSnippingMode();

        if (rect.w < 12 || rect.h < 12) return;

        try {
            await smartCaptureArea4K(rect);
        } catch (err) {
            console.error('Ошибка создания скриншота:', err);
            showToast('Ошибка копирования');
        }
    }

    snipOverlay.addEventListener('pointerdown', snipPointerDown);
    snipOverlay.addEventListener('pointermove', snipPointerMove);
    snipOverlay.addEventListener('pointerup', snipPointerUp);
    snipOverlay.addEventListener('pointercancel', (e) => {
        if (isSelectingRect) {
            stopSnippingMode();
        }
    });
    snipOverlay.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        stopSnippingMode();
    });

    function drawTrackedText(ctx, text, x, y, letterSpacingPx) {
        if (!letterSpacingPx || letterSpacingPx === 0) {
            ctx.fillText(text, x, y);
            return;
        }
        const chars = Array.from(text);
        let totalWidth = 0;
        for (let i = 0; i < chars.length; i++) {
            totalWidth += ctx.measureText(chars[i]).width + (i < chars.length - 1 ? letterSpacingPx : 0);
        }

        let currentX = x;
        if (ctx.textAlign === 'center') {
            currentX = x - totalWidth / 2;
        } else if (ctx.textAlign === 'right') {
            currentX = x - totalWidth;
        }

        const prevAlign = ctx.textAlign;
        ctx.textAlign = 'left';
        for (let i = 0; i < chars.length; i++) {
            ctx.fillText(chars[i], currentX, y);
            currentX += ctx.measureText(chars[i]).width + letterSpacingPx;
        }
        ctx.textAlign = prevAlign;
    }

    async function smartCaptureArea4K(rect) {
        const MIN_ZOOM_FOR_DETAIL = 12;
        const SMART_ZOOM_DURATION = 120;

        const areaSize = Math.max(rect.w, rect.h);
        const needsSmartZoom = map.getZoom() < MIN_ZOOM_FOR_DETAIL && areaSize < 600;

        if (needsSmartZoom) {
            const savedCenter = map.getCenter();
            const savedZoom = map.getZoom();

            const targetZoom = Math.min(18, Math.max(MIN_ZOOM_FOR_DETAIL + 2, map.getZoom() + 4));
            const centerX = rect.x + rect.w / 2;
            const centerY = rect.y + rect.h / 2;
            const targetLngLat = map.unproject([centerX, centerY]);

            map.jumpTo({ center: targetLngLat, zoom: targetZoom });

            await new Promise(resolve => map.once('render', resolve));
            await new Promise(resolve => setTimeout(resolve, SMART_ZOOM_DURATION));

            const result = await captureAreaToClipboard4K(rect);

            map.jumpTo({ center: savedCenter, zoom: savedZoom });

            showToast(`Скопировано (умный зум ${targetZoom.toFixed(1)})`);

            return result;
        }

        return await captureAreaToClipboard4K(rect);
    }

    async function captureAreaToClipboard4K(rect) {
        showToast('Рендер в 4K...');

        const savedOsmState = OSM_LABEL_LAYERS.map(id => ({
            id,
            vis: map.getLayer(id) ? map.getLayoutProperty(id, 'visibility') : 'none'
        }));

        OSM_LABEL_LAYERS.forEach(id => {
            if (map.getLayer(id)) {
                try { map.setLayoutProperty(id, 'visibility', 'none'); } catch(_) {}
            }
        });

        if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
        }
        forceCustomMarkersVisible();

        map.triggerRepaint();
        await new Promise(resolve => map.once('render', resolve));

        const mapCanvas = map.getCanvas();
        const cssWidth = mapCanvas.clientWidth;
        const cssHeight = mapCanvas.clientHeight;

        const maxSide = Math.max(rect.w, rect.h);
        const target4kScale = Math.max(2, Math.min(4, 3840 / maxSide));

        const outCanvas = document.createElement('canvas');
        outCanvas.width = Math.round(rect.w * target4kScale);
        outCanvas.height = Math.round(rect.h * target4kScale);

        const ctx = outCanvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        const canvasScaleX = mapCanvas.width / cssWidth;
        const canvasScaleY = mapCanvas.height / cssHeight;

        ctx.drawImage(
            mapCanvas,
            rect.x * canvasScaleX,
            rect.y * canvasScaleY,
            rect.w * canvasScaleX,
            rect.h * canvasScaleY,
            0,
            0,
            outCanvas.width,
            outCanvas.height
        );

        ctx.save();
        ctx.scale(target4kScale, target4kScale);
        ctx.translate(-rect.x, -rect.y);

        if (appSettings.showLabels) {
            markers.forEach(item => {
                if (item.element.classList.contains('marker-hidden')) return;

                const pos = map.project(item.lngLat);
                if (pos.x < rect.x - 160 || pos.x > rect.x + rect.w + 160 ||
                    pos.y < rect.y - 60 || pos.y > rect.y + rect.h + 60) {
                    return;
                }

                const p = item.place;
                const computed = window.getComputedStyle(item.labelEl);

                if (p.dot) {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#333333';
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                }

                const fontWeight = computed.fontWeight || '400';
                const fontSize = computed.fontSize || '10px';
                const fontFamily = computed.fontFamily || 'CustomArial, Arial, sans-serif';
                const color = computed.color || '#2b2b2b';
                const letterSpacing = parseFloat(computed.letterSpacing) || 0;
                const text = p.type === 'obl' ? p.name.toUpperCase() : p.name;

                ctx.font = `${fontWeight} ${fontSize} ${fontFamily}`;
                ctx.textBaseline = p.dot ? 'top' : 'middle';
                ctx.textAlign = p.dot ? 'left' : 'center';

                const textX = p.dot ? pos.x + 6 : pos.x;
                const textY = p.dot ? pos.y + 4 : pos.y;

                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                drawTrackedText(ctx, text, textX + 1.5, textY + 1.5, letterSpacing);

                ctx.fillStyle = color;
                drawTrackedText(ctx, text, textX, textY, letterSpacing);
            });
        }

        spawnedUnits.forEach(unit => {
            const pos = map.project(unit.marker.getLngLat());
            const img = unit.img;
            if (!img.complete || img.naturalWidth === 0) return;

            const drawW = appSettings.unitSize;
            const aspect = img.naturalHeight / img.naturalWidth;
            const drawH = drawW * aspect;

            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate((unit.angle * Math.PI) / 180);

            if (appSettings.unitOutline) {
                const pad = 4;
                const tmp = document.createElement('canvas');
                tmp.width = Math.ceil((drawW + pad * 2) * target4kScale);
                tmp.height = Math.ceil((drawH + pad * 2) * target4kScale);
                const tctx = tmp.getContext('2d');
                tctx.scale(target4kScale, target4kScale);

                const cx = pad;
                const cy = pad;
                const d = 0.6;

                tctx.save();
                tctx.filter = 'brightness(0) invert(1)';
                const offsets = [
                    [d, 0], [-d, 0], [0, d], [0, -d],
                    [d * 0.7, d * 0.7], [-d * 0.7, -d * 0.7]
                ];
                for (const [ox, oy] of offsets) {
                    tctx.drawImage(img, cx + ox, cy + oy, drawW, drawH);
                }
                tctx.restore();
                tctx.drawImage(img, cx, cy, drawW, drawH);

                ctx.shadowColor = 'rgba(255, 255, 255, 0.35)';
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 1;
                ctx.drawImage(tmp, -drawW / 2 - pad, -drawH / 2 - pad, drawW + pad * 2, drawH + pad * 2);
            } else {
                ctx.shadowColor = 'rgba(255, 255, 255, 0.35)';
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 1;
                ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
            }

            ctx.restore();
        });

        ctx.restore();

        const dScale = appSettings.disclaimerScale / 100;
        const dWidth = 320 * dScale;
        const dPad = 16;

        const dCanvas = document.createElement('canvas');
        dCanvas.width = Math.ceil((dWidth + dPad * 2) * target4kScale);
        dCanvas.height = Math.ceil(400 * target4kScale);
        const dCtx = dCanvas.getContext('2d');
        dCtx.scale(target4kScale, target4kScale);
        dCtx.translate(dPad, dPad);
        dCtx.fillStyle = '#ffffff';
        dCtx.strokeStyle = '#000000';
        dCtx.lineWidth = 1.3;
        
        dCtx.font = '13px Arial, sans-serif';
        dCtx.fillStyle = '#1f2937';
        dCtx.textBaseline = 'top';
        dCtx.textAlign = 'left';
        
        const pad = 14;
        const maxWidth = dWidth - pad * 2;
        const words = appSettings.disclaimerText.split(' ');
        let line = '';
        let lineY = pad;
        const lineHeight = 13 * 1.4;

        for (let i = 0; i < words.length; i++) {
            const testLine = line + words[i] + ' ';
            const metrics = dCtx.measureText(testLine);
            if (metrics.width > maxWidth && line !== '') {
                dCtx.fillText(line.trim(), pad, lineY);
                line = words[i] + ' ';
                lineY += lineHeight;
            } else {
                line = testLine;
            }
        }
        if (line.trim()) {
            dCtx.fillText(line.trim(), pad, lineY);
            lineY += lineHeight;
        }

        lineY += 4;
        dCtx.beginPath();
        dCtx.strokeStyle = '#e5e7eb';
        dCtx.lineWidth = 1;
        dCtx.moveTo(pad, lineY);
        dCtx.lineTo(dWidth - pad, lineY);
        dCtx.stroke();
        lineY += 4;

        const bounds = map.getBounds();
        const uniqueUnits = new Map();
        spawnedUnits.forEach(unit => {
            const lngLat = unit.marker.getLngLat();
            if (bounds.contains(lngLat)) {
                if (!uniqueUnits.has(unit.label)) {
                    uniqueUnits.set(unit.label, { file: unit.file, label: unit.label });
                }
            }
        });

        if (uniqueUnits.size === 0) {
            dCtx.font = 'italic 12px Arial, sans-serif';
            dCtx.fillStyle = '#9ca3af';
            dCtx.fillText('Нет объектов в кадре', pad, lineY);
            lineY += 16;
        } else {
            let itemX = pad;
            const iconSize = 20;
            const gap = 10;

            uniqueUnits.forEach((data) => {
                const img = new Image();
                img.src = `./icons/${data.file}`;
                img.alt = data.label;

                dCtx.font = '600 13px Arial, sans-serif';
                const textW = dCtx.measureText(data.label).width;
                const totalW = iconSize + 6 + textW;

                if (itemX + totalW > dWidth - pad) {
                    itemX = pad;
                    lineY += 22;
                }

                if (img.complete && img.naturalWidth > 0) {
                    const aspect = img.naturalHeight / img.naturalWidth;
                    let drawW = iconSize;
                    let drawH = iconSize * aspect;
                    if (drawW > iconSize) {
                        drawW = iconSize;
                        drawH = iconSize * aspect;
                    }
                    if (drawH > iconSize) {
                        drawH = iconSize;
                        drawW = iconSize / aspect;
                    }
                    const offsetX = (iconSize - drawW) / 2;
                    const offsetY = (iconSize - drawH) / 2;
                    dCtx.drawImage(img, itemX + offsetX, lineY + offsetY, drawW, drawH);
                }

                dCtx.fillStyle = '#374151';
                dCtx.textBaseline = 'middle';
                dCtx.fillText(data.label, itemX + iconSize + 6, lineY + iconSize / 2);

                itemX += totalW + gap;
            });
        }

        lineY += 16;

        const totalH = lineY + pad;
        dCanvas.height = Math.ceil((totalH + dPad * 2) * target4kScale);

        dCtx.clearRect(0, 0, dCanvas.width, dCanvas.height);
        dCtx.save();
        dCtx.scale(target4kScale, target4kScale);
        dCtx.translate(dPad, dPad);

        dCtx.fillStyle = '#ffffff';
        dCtx.strokeStyle = '#000000';
        dCtx.lineWidth = 1.3;
        dCtx.beginPath();
        const r = 5;
        const x0 = 0, y0 = 0, w0 = dWidth, h0 = totalH;
        dCtx.moveTo(x0 + r, y0);
        dCtx.lineTo(x0 + w0 - r, y0);
        dCtx.quadraticCurveTo(x0 + w0, y0, x0 + w0, y0 + r);
        dCtx.lineTo(x0 + w0, y0 + h0 - r);
        dCtx.quadraticCurveTo(x0 + w0, y0 + h0, x0 + w0 - r, y0 + h0);
        dCtx.lineTo(x0 + r, y0 + h0);
        dCtx.quadraticCurveTo(x0, y0 + h0, x0, y0 + h0 - r);
        dCtx.lineTo(x0, y0 + r);
        dCtx.quadraticCurveTo(x0, y0, x0 + r, y0);
        dCtx.closePath();
        dCtx.fill();
        dCtx.stroke();

        dCtx.fillStyle = '#1f2937';
        dCtx.textBaseline = 'top';
        dCtx.textAlign = 'left';
        dCtx.font = '13px Arial, sans-serif';

        let recY = pad;
        const recWords = appSettings.disclaimerText.split(' ');
        let recLine = '';
        
        for (let i = 0; i < recWords.length; i++) {
            const testLine = recLine + recWords[i] + ' ';
            const metrics = dCtx.measureText(testLine);
            if (metrics.width > maxWidth && recLine !== '') {
                dCtx.fillText(recLine.trim(), pad, recY);
                recLine = recWords[i] + ' ';
                recY += lineHeight;
            } else {
                recLine = testLine;
            }
        }
        if (recLine.trim()) {
            dCtx.fillText(recLine.trim(), pad, recY);
            recY += lineHeight;
        }

        recY += 4;
        dCtx.beginPath();
        dCtx.strokeStyle = '#e5e7eb';
        dCtx.lineWidth = 1;
        dCtx.moveTo(pad, recY);
        dCtx.lineTo(dWidth - pad, recY);
        dCtx.stroke();
        recY += 4;

        if (uniqueUnits.size === 0) {
            dCtx.font = 'italic 12px Arial, sans-serif';
            dCtx.fillStyle = '#9ca3af';
            dCtx.fillText('Нет объектов в кадре', pad, recY);
        } else {
            let itemX = pad;
            const iconSize = 20;
            const gap = 10;

            uniqueUnits.forEach((data) => {
                const img = new Image();
                img.src = `./icons/${data.file}`;
                img.alt = data.label;

                dCtx.font = '600 13px Arial, sans-serif';
                const textW = dCtx.measureText(data.label).width;
                const totalW = iconSize + 6 + textW;

                if (itemX + totalW > dWidth - pad) {
                    itemX = pad;
                    recY += 22;
                }

                if (img.complete && img.naturalWidth > 0) {
                    const aspect = img.naturalHeight / img.naturalWidth;
                    let drawW = iconSize;
                    let drawH = iconSize * aspect;
                    if (drawH > iconSize) {
                        drawH = iconSize;
                        drawW = iconSize / aspect;
                    }
                    const offsetX = (iconSize - drawW) / 2;
                    const offsetY = (iconSize - drawH) / 2;
                    dCtx.drawImage(img, itemX + offsetX, recY + offsetY, drawW, drawH);
                }

                dCtx.fillStyle = '#374151';
                dCtx.textBaseline = 'middle';
                dCtx.fillText(data.label, itemX + iconSize + 6, recY + iconSize / 2);

                itemX += totalW + gap;
            });
        }

        dCtx.restore();

        const destX = 16;
        const destY = outCanvas.height - dCanvas.height - 16;
        ctx.drawImage(dCanvas, destX, destY);

        const blob = await new Promise(resolve => outCanvas.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('Не удалось сформировать PNG');

        try {
            await navigator.clipboard.write([
                new ClipboardItem({ 'image/png': blob })
            ]);
            showToast(`Скопировано в буфер (${outCanvas.width}×${outCanvas.height})`);
        } catch (err) {
            const link = document.createElement('a');
            link.download = `map-${Date.now()}.png`;
            link.href = URL.createObjectURL(blob);
            link.click();
            showToast(`Сохранено (${outCanvas.width}×${outCanvas.height})`);
        }

        savedOsmState.forEach(({id, vis}) => {
            if (map.getLayer(id) && vis) {
                try { map.setLayoutProperty(id, 'visibility', vis); } catch(_) {}
            }
        });
        osmLabelsVisible = null;
        updateOsmLabelsVisibility();
        updateMarkersVisibility();

        return blob;
    }

    function applyAllSettingsToMap() {
        if (map && map.triggerRepaint) {
            map.triggerRepaint();
        }

        spawnedUnits.forEach(u => {
            u.img.style.width = `${appSettings.unitSize}px`;
        });

        if (appSettings.unitOutline) {
            document.body.classList.add('unit-outline-enabled');
        } else {
            document.body.classList.remove('unit-outline-enabled');
        }

        const factor = appSettings.bordersOpacity / 100;
        Object.entries(BORDER_BASE_OPACITY).forEach(([layerId, baseOp]) => {
            if (map.getLayer(layerId)) {
                map.setPaintProperty(layerId, 'line-opacity', baseOp * factor);
            }
        });

        const landcoverVis = appSettings.showLandcover ? 'visible' : 'none';
        ['forest-fill', 'forest-outline', 'forest-points', 'towns-fill', 'towns-outline', 'towns-points'].forEach(layerId => {
            if (map.getLayer(layerId)) {
                map.setLayoutProperty(layerId, 'visibility', landcoverVis);
            }
        });

        if (map.getLayer('towns-outline')) {
            map.setPaintProperty('towns-outline', 'line-opacity', appSettings.showTownsBorders ? 0.9 : 0);
            map.setPaintProperty('towns-outline', 'line-width', appSettings.townsBorderWidth);
        }

        disclaimerText.textContent = appSettings.disclaimerText;
        
        const dScale = appSettings.disclaimerScale / 100;
        if (window.innerWidth > 768) {
            disclaimerBlock.style.width = `${320 * dScale}px`;
            disclaimerBlock.style.padding = `${14 * dScale}px`;
            disclaimerText.style.fontSize = `${13 * dScale}px`;
            disclaimerUnits.style.gap = `${6 * dScale}px ${10 * dScale}px`;
        } else {
            disclaimerBlock.style.width = `${260 * dScale}px`;
            disclaimerBlock.style.padding = `${10 * dScale}px ${12 * dScale}px`;
            disclaimerText.style.fontSize = `${12 * dScale}px`;
            disclaimerUnits.style.gap = `${4 * dScale}px ${8 * dScale}px`;
        }

        updateMarkersVisibility();
    }

    });

    ctrlLandcover.addEventListener('change', (e) => {
        appSettings.showLandcover = e.target.checked;
        saveSettings(appSettings);
        applyAllSettingsToMap();
    });

    ctrlTownsBorders.addEventListener('change', (e) => {
        appSettings.showTownsBorders = e.target.checked;
        saveSettings(appSettings);
        applyAllSettingsToMap();
    });

    ctrlTownsBorderWidth.addEventListener('input', (e) => {
        appSettings.townsBorderWidth = Number(e.target.value);
        valTownsBorderWidth.textContent = `${appSettings.townsBorderWidth} px`;
        saveSettings(appSettings);
        applyAllSettingsToMap();
    });

    ctrlDisclaimerText.addEventListener('input', (e) => {
        appSettings.disclaimerText = e.target.value;
        saveSettings(appSettings);
        applyAllSettingsToMap();
    });

    ctrlDisclaimerScale.addEventListener('input', (e) => {
        appSettings.disclaimerScale = Number(e.target.value);
        valDisclaimerScale.textContent = `${appSettings.disclaimerScale}%`;
        saveSettings(appSettings);
        applyAllSettingsToMap();
    });

    resetBtn.addEventListener('click', () => {
        appSettings = { ...DEFAULT_SETTINGS };
        saveSettings(appSettings);
        syncUiWithSettings();
        applyAllSettingsToMap();
    });

    syncUiWithSettings();
    applyAllSettingsToMap();
</script>

</body>
</html>
