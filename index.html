<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта НП</title>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/earcut@2.2.4/dist/earcut.min.js"></script>
    <style>
        @font-face {
            font-family: 'CustomArial';
            src: url('./arialmt.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'CustomArial';
            src: url('./arialmt.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'CustomArial', Arial, sans-serif;
            background: #111;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .marker-with-dot,
        .marker-center {
            position: relative;
            width: 0;
            height: 0;
            pointer-events: none;
            user-select: none;
            transition: opacity 0.3s ease-in-out;
            opacity: 1;
        }

        .marker-hidden {
            display: none !important;
        }

        .map-label {
            position: absolute;
            white-space: nowrap;
            line-height: 1;
            pointer-events: none;
        }

        .map-label::after {
            content: attr(data-shadow);
            position: absolute;
            left: 1.5px;
            top: 1.5px;
            color: rgba(255, 255, 255, 0.75);
            z-index: -1;
        }

        .style-obl {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #111111;
        }

        .style-ray {
            font-size: 11.5px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .style-selo {
            font-size: 10px;
            font-weight: 400;
            color: #2b2b2b;
        }

        .custom-dot {
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 4px;
            background-color: #333333;
            border: 1px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 0.6px rgba(0, 0, 0, 0.25);
            transform: translate(-50%, -50%);
        }

        .marker-with-dot .map-label {
            left: 6px;
            top: 4px;
        }

        .marker-center .map-label {
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
        }

        /* ================= ЗАСПАВНЕННЫЕ ОБЪЕКТЫ ================= */
        .spawned-unit {
            position: relative;
            width: 0;
            height: 0;
            cursor: grab;
            user-select: none;
            z-index: 20;
        }

        .spawned-unit:active {
            cursor: grabbing;
            z-index: 30;
        }

        .spawned-unit img {
            position: absolute;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%) rotate(0deg);
            transform-origin: center center;
            pointer-events: auto;
            -webkit-user-drag: none;
            filter: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.35));
            transition: filter 0.15s ease;
        }

        body.unit-outline-enabled .spawned-unit img {
            filter:
                drop-shadow(0.6px 0 0 rgba(255, 255, 255, 0.95))
                drop-shadow(-0.6px 0 0 rgba(255, 255, 255, 0.95))
                drop-shadow(0 0.6px 0 rgba(255, 255, 255, 0.95))
                drop-shadow(0 -0.6px 0 rgba(255, 255, 255, 0.95))
                drop-shadow(0 1px 2px rgba(255, 255, 255, 0.35));
        }

        .spawned-unit:hover img {
            filter:
                drop-shadow(0 0 5px rgba(255, 255, 255, 1))
                drop-shadow(0 2px 6px rgba(255, 255, 255, 0.95));
        }

        body.unit-outline-enabled .spawned-unit:hover img {
            filter:
                drop-shadow(1.2px 0 0 rgba(255, 255, 255, 0.98))
                drop-shadow(-1.2px 0 0 rgba(255, 255, 255, 0.98))
                drop-shadow(0 1.2px 0 rgba(255, 255, 255, 0.98))
                drop-shadow(0 -1.2px 0 rgba(255, 255, 255, 0.98))
                drop-shadow(0.9px 0.9px 0 rgba(255, 255, 255, 0.98))
                drop-shadow(-0.9px -0.9px 0 rgba(255, 255, 255, 0.98))
                drop-shadow(0.9px -0.9px 0 rgba(255, 255, 255, 0.98))
                drop-shadow(-0.9px 0.9px 0 rgba(255, 255, 255, 0.98))
                drop-shadow(0 0 6px rgba(255, 255, 255, 1));
        }

        .spawned-angle-badge {
            position: absolute;
            top: -28px;
            left: 0;
            transform: translateX(-50%);
            background: rgba(16, 18, 24, 0.82);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            white-space: nowrap;
        }

        .spawned-unit.rotating .spawned-angle-badge {
            opacity: 1;
        }

        /* ================= LIQUID GLASS UI ================= */
        .top-right-controls {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 900;
            display: flex;
            gap: 10px;
            transition: opacity 0.2s ease;
        }

        .glass-icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-top-color: rgba(255, 255, 255, 0.45);
            background: linear-gradient(135deg, rgba(28, 30, 36, 0.68), rgba(16, 18, 22, 0.58));
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
            color: #f2f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, border-color 0.2s ease;
        }

        .glass-icon-btn:hover {
            transform: scale(1.06);
            border-color: rgba(255, 255, 255, 0.42);
            background: linear-gradient(135deg, rgba(38, 41, 49, 0.78), rgba(22, 24, 30, 0.68));
        }

        .glass-icon-btn:active {
            transform: scale(0.95);
        }

        .glass-icon-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #openSettingsBtn.active svg {
            transform: rotate(90deg);
        }

        /* ================= ПАНЕЛЬ СПАВНА ОБЪЕКТОВ (DOCK) ================= */
        .spawn-dock-wrapper {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 890;
            max-width: calc(100vw - 24px);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s ease;
        }

        .spawn-dock {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(30, 34, 42, 0.66), rgba(16, 18, 24, 0.56));
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-top-color: rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 12px 32px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.28);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .spawn-dock::-webkit-scrollbar {
            display: none;
        }

        .spawn-item-btn {
            position: relative;
            flex-shrink: 0;
            width: 46px;
            height: 48px;
            border-radius: 13px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 4px 2px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s ease, border-color 0.15s ease;
        }

        .spawn-item-btn:hover {
            transform: translateY(-4px) scale(1.08);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .spawn-item-btn:active {
            transform: translateY(-1px) scale(0.96);
        }

        .spawn-item-btn img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 1px 3px rgba(255, 255, 255, 0.5));
        }

        .spawn-item-label {
            font-size: 8.5px;
            color: rgba(255, 255, 255, 0.82);
            max-width: 42px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1;
            pointer-events: none;
        }

        .clear-units-btn {
            flex-shrink: 0;
            height: 42px;
            padding: 0 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 95, 95, 0.32);
            border-top-color: rgba(255, 140, 140, 0.45);
            background: linear-gradient(145deg, rgba(60, 22, 26, 0.72), rgba(34, 14, 18, 0.64));
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            color: #ffd6d6;
            font-family: inherit;
            font-size: 11.5px;
            font-weight: 700;
            display: none;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
        }

        .clear-units-btn.visible {
            display: flex;
        }

        .clear-units-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(145deg, rgba(85, 28, 34, 0.82), rgba(48, 16, 20, 0.74));
        }

        /* ================= РЕЖИМ СКРИНШОТА (WINDOWS SNIPPING STYLE) ================= */
        .snip-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            cursor: crosshair;
            display: none;
            user-select: none;
        }

        .snip-overlay.active {
            display: block;
        }

        .snip-selection-box {
            position: fixed;
            border: 1.5px solid rgba(255, 255, 255, 0.92);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.48), inset 0 0 0 1px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            display: none;
        }

        .snip-full-dim {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.48);
            pointer-events: none;
        }

        .snip-hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 9px 16px;
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(32, 36, 44, 0.78), rgba(18, 20, 26, 0.72));
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-top-color: rgba(255, 255, 255, 0.45);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            font-size: 12.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .snip-hud kbd {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 5px;
            padding: 1px 6px;
            font-family: inherit;
            font-size: 11px;
        }

        .snip-size-badge {
            position: fixed;
            background: rgba(14, 16, 22, 0.85);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            pointer-events: none;
            display: none;
            font-variant-numeric: tabular-nums;
        }

        .glass-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translate(-50%, -24px);
            z-index: 2500;
            padding: 10px 18px;
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(28, 34, 42, 0.82), rgba(16, 20, 26, 0.76));
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-top-color: rgba(255, 255, 255, 0.48);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.48);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }

        .glass-toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        /* ================= МОДАЛЬНОЕ ОКНО НАСТРОЕК ================= */
        .settings-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 12, 16, 0.28);
            backdrop-filter: blur(14px) saturate(125%);
            -webkit-backdrop-filter: blur(14px) saturate(125%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .settings-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-modal {
            width: 350px;
            max-width: calc(100vw - 32px);
            padding: 20px;
            border-radius: 24px;
            color: #f4f6fa;
            position: relative;
            overflow: hidden;

            background: linear-gradient(
                145deg,
                rgba(36, 40, 48, 0.62) 0%,
                rgba(18, 20, 26, 0.52) 100%
            );
            backdrop-filter: blur(32px) saturate(190%) contrast(105%);
            -webkit-backdrop-filter: blur(32px) saturate(190%) contrast(105%);
            
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-top: 1px solid rgba(255, 255, 255, 0.42);
            border-left: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 
                0 24px 60px rgba(0, 0, 0, 0.55),
                0 2px 10px rgba(0, 0, 0, 0.25),
                inset 0 1px 1px rgba(255, 255, 255, 0.35),
                inset 0 -10px 24px rgba(0, 0, 0, 0.2);

            transform: scale(0.86) translateY(16px);
            opacity: 0;
            transition: 
                transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.28s ease;
        }

        .settings-backdrop.open .settings-modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .settings-modal::before {
            content: '';
            position: absolute;
            top: -40%;
            left: -20%;
            width: 140%;
            height: 70%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #ffffff;
        }

        .close-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            transition: background 0.2s, transform 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: scale(1.08);
        }

        .settings-section {
            margin-bottom: 14px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.48);
            margin-bottom: 10px;
        }

        .control-row {
            margin-bottom: 12px;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 6px;
        }

        .control-val {
            font-size: 11.5px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.65);
            font-variant-numeric: tabular-nums;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            outline: none;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            user-select: none;
        }

        .switch {
            position: relative;
            width: 38px;
            height: 22px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            transition: background 0.25s ease, border-color 0.25s ease;
            flex-shrink: 0;
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        input[type="checkbox"]:checked + .switch {
            background: rgba(96, 165, 250, 0.55);
            border-color: rgba(147, 197, 253, 0.65);
        }

        input[type="checkbox"]:checked + .switch::after {
            transform: translateX(16px);
        }

        .modal-footer {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: flex-end;
        }

        .reset-btn {
            padding: 7px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.15s;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
        }

        .reset-btn:active {
            transform: scale(0.96);
        }

        body.taking-screenshot .top-right-controls,
        body.taking-screenshot .spawn-dock-wrapper,
        body.taking-screenshot .maplibregl-ctrl-bottom-left,
        body.taking-screenshot .maplibregl-ctrl-bottom-right,
        body.taking-screenshot .maplibregl-ctrl-top-left,
        body.taking-screenshot .maplibregl-ctrl-top-right {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

<div id="map"></div>

<!-- Кнопки справа сверху: Фотоаппарат и Настройки -->
<div class="top-right-controls">
    <button class="glass-icon-btn" id="openSnipBtn" title="Скриншот области в 4K (буфер обмена)" aria-label="Скриншот области">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
        </svg>
    </button>

    <button class="glass-icon-btn" id="openSettingsBtn" title="Настройки карты" aria-label="Настройки карты">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>

<script>
    /* ================= УПРАВЛЕНИЕ НАСТРОЙКАМИ И LOCALSTORAGE ================= */
    const STORAGE_KEY = 'karta_np_settings_v3';

    const DEFAULT_SETTINGS = {
        saturation: 0,       // 0..100 (%)
        darkness: 30,        // 0..85 (%)
        shadowFloor: 22,     // 0..60 (%)
        unitSize: 34,        // 18..72 (px)
        unitOutline: true,   // Белая обводка по силуэту БПЛА
        bordersOpacity: 100, // 0..100 (%)
        showLabels: true,
        showLandcover: true
    };

    function loadSettings() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return { ...DEFAULT_SETTINGS };
            return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
        } catch (e) {
            return { ...DEFAULT_SETTINGS };
        }
    }

    function saveSettings(settings) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (e) {}
    }

    let appSettings = loadSettings();

    /* ================= СПИСОК ИКОНОК ОБЪЕКТОВ ИЗ ./icons/ ================= */
    const UNIT_CATALOG = [
        { file: 'шахед.png', label: 'Шахед' },
        { file: 'gerbera.png', label: 'Гербера' },
        { file: 'італмас.png', label: 'Італмас' },
        { file: 'молнія.png', label: 'Молнія' },
        { file: 'ланцет.png', label: 'Ланцет' },
        { file: 'зала.png', label: 'ZALA' },
        { file: 'orlan.png', label: 'Орлан' },
        { file: 'скам.png', label: 'Скам' },
        { file: 'фпв.png', label: 'FPV' },
        { file: 'розвіддрон.png', label: 'Розвід.' },
        { file: 'реактивний.png', label: 'Реакт.' },
        { file: 'banderola.png', label: 'Бандероль' },
        { file: 'avia.png', label: 'Авіа' },
        { file: 'kab.png', label: 'КАБ' },
        { file: 'bp.png', label: 'БПЛА' },
        { file: 'невідомий.png', label: 'Невідом.' }
    ];

    /* ================= ИНИЦИАЛИЗАЦИЯ КАРТЫ ================= */
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://api.maptiler.com/maps/01a15d84-49c8-768b-8c27-37c84b553d7e/style.json?key=NxVg5ozWhACUzHBh2DZr',
        center: [33.56587, 51.87999],
        zoom: 8.3,
        preserveDrawingBuffer: true
    });

    function getGeomBBox(geom) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        const scan = (coords) => {
            if (typeof coords[0] === 'number') {
                if (coords[0] < minX) minX = coords[0];
                if (coords[0] > maxX) maxX = coords[0];
                if (coords[1] < minY) minY = coords[1];
                if (coords[1] > maxY) maxY = coords[1];
            } else {
                for (let i = 0; i < coords.length; i++) scan(coords[i]);
            }
        };
        if (geom && geom.coordinates) scan(geom.coordinates);
        return [minX, minY, maxX, maxY];
    }

    function bindTownsMinZoom(townsData, places) {
        if (!townsData || !Array.isArray(townsData.features) || !Array.isArray(places)) {
            return townsData;
        }

        const placeZoomMap = new Map();
        places.forEach(p => {
            if (p && p.name && typeof p.minZoom === 'number') {
                placeZoomMap.set(p.name.trim().toLowerCase(), p.minZoom);
            }
        });

        for (let i = 0; i < townsData.features.length; i++) {
            const feature = townsData.features[i];
            if (!feature.properties) feature.properties = {};

            const townName = (feature.properties.name || feature.properties.NAME || '').trim().toLowerCase();
            let matchedZoom = placeZoomMap.get(townName);

            if (matchedZoom === undefined) {
                const bbox = getGeomBBox(feature.geometry);
                const cx = (bbox[0] + bbox[2]) * 0.5;
                const cy = (bbox[1] + bbox[3]) * 0.5;
                
                let bestDistSq = Infinity;
                let closestZoom = 0;

                places.forEach(p => {
                    if (!p || !Array.isArray(p.coords)) return;
                    const dx = p.coords[0] - cx;
                    const dy = p.coords[1] - cy;
                    const dSq = dx * dx + dy * dy;
                    if (dSq < bestDistSq) {
                        bestDistSq = dSq;
                        closestZoom = typeof p.minZoom === 'number' ? p.minZoom : 0;
                    }
                });
                matchedZoom = closestZoom;
            }

            feature.properties.minZoom = matchedZoom;
        }

        return townsData;
    }

    function addGeoJsonLayer(map, name, dataOrUrl, color, beforeId, useZoomFilter) {
        const dataPromise = typeof dataOrUrl === 'string'
            ? fetch(dataOrUrl).then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status} при загрузке ${dataOrUrl}`);
                return r.json();
            })
            : Promise.resolve(dataOrUrl);

        return dataPromise
            .then(data => {
                if (map.getSource(name)) return;
                map.addSource(name, { type: 'geojson', data: data });

                const zoomFilter = useZoomFilter ? ['>=', ['zoom'], ['coalesce', ['get', 'minZoom'], 0]] : null;
                const vis = appSettings.showLandcover ? 'visible' : 'none';

                const fillLayer = {
                    id: `${name}-fill`,
                    type: 'fill',
                    source: name,
                    layout: { 'visibility': vis },
                    paint: {
                        'fill-color': color,
                        'fill-opacity': 1
                    }
                };
                if (zoomFilter) fillLayer.filter = zoomFilter;
                map.addLayer(fillLayer, beforeId);

                const outlineLayer = {
                    id: `${name}-outline`,
                    type: 'line',
                    source: name,
                    layout: { 'visibility': vis },
                    paint: {
                        'line-color': color,
                        'line-width': 0.5,
                        'line-opacity': 0.6
                    }
                };
                if (zoomFilter) outlineLayer.filter = zoomFilter;
                map.addLayer(outlineLayer, beforeId);

                const pointsFilter = zoomFilter
                    ? ['all', ['==', ['geometry-type'], 'Point'], zoomFilter]
                    : ['==', ['geometry-type'], 'Point'];

                map.addLayer({
                    id: `${name}-points`,
                    type: 'circle',
                    source: name,
                    filter: pointsFilter,
                    layout: { 'visibility': vis },
                    paint: {
                        'circle-color': color,
                        'circle-radius': 3,
                        'circle-stroke-color': '#ffffff',
                        'circle-stroke-width': 0.5
                    }
                }, beforeId);
            })
            .catch(err => console.error(`Ошибка слоя ${name}:`, err));
    }

    const BORDER_BASE_OPACITY = {
        'gromady-line': 0.2,
        'rayony_ukrainy-line': 0.2,
        'regions-line': 0.9,
        'ukraine-line': 1.0
    };

    function addLineLayer(map, name, url, color, width, opacity, beforeId) {
        return fetch(url)
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status} при загрузке ${url}`);
                return r.json();
            })
            .then(data => {
                if (map.getSource(name)) return;
                map.addSource(name, { type: 'geojson', data: data });

                const layerId = `${name}-line`;
                const factor = BORDER_BASE_OPACITY[layerId] !== undefined ? (appSettings.bordersOpacity / 100) : 1;

                map.addLayer({
                    id: layerId,
                    type: 'line',
                    source: name,
                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    paint: {
                        'line-color': color,
                        'line-width': width,
                        'line-opacity': opacity * factor
                    }
                }, beforeId);
            })
            .catch(err => console.error(`Ошибка линейного слоя ${name}:`, err));
    }

    /* ================= CUSTOM WEBGL LAYER ================= */
    function createOutsideOsmLayer(ukraineData) {
        const rings = [];
        const collect = (geom) => {
            if (!geom) return;
            if (geom.type === 'Polygon') {
                geom.coordinates.forEach(r => rings.push(r));
            } else if (geom.type === 'MultiPolygon') {
                geom.coordinates.forEach(poly => poly.forEach(r => rings.push(r)));
            } else if (geom.type === 'GeometryCollection') {
                geom.geometries.forEach(collect);
            }
        };
        if (ukraineData.type === 'FeatureCollection') {
            ukraineData.features.forEach(f => collect(f.geometry));
        } else if (ukraineData.type === 'Feature') {
            collect(ukraineData.geometry);
        } else {
            collect(ukraineData);
        }

        const worldRing = [
            [-180, -85],
            [ 180, -85],
            [ 180,  85],
            [-180,  85],
            [-180, -85]
        ];

        const flatCoords = [];
        const holeIndices = [];

        for (const pt of worldRing) {
            const mc = maplibregl.MercatorCoordinate.fromLngLat(pt);
            flatCoords.push(mc.x, mc.y);
        }

        for (const ring of rings) {
            if (ring.length < 4) continue;
            holeIndices.push(flatCoords.length / 2);
            for (const pt of ring) {
                const mc = maplibregl.MercatorCoordinate.fromLngLat(pt);
                flatCoords.push(mc.x, mc.y);
            }
        }

        const triangles = earcut(flatCoords, holeIndices, 2);
        const vertices = new Float32Array(triangles.length * 2);
        for (let i = 0; i < triangles.length; i++) {
            const idx = triangles[i] * 2;
            vertices[i * 2] = flatCoords[idx];
            vertices[i * 2 + 1] = flatCoords[idx + 1];
        }

        const tileCache = new Map();
        const maxCache = 200;

        function getTileTexture(gl, mapInstance, z, x, y) {
            const key = `${z}/${x}/${y}`;
            if (tileCache.has(key)) {
                const entry = tileCache.get(key);
                tileCache.delete(key);
                tileCache.set(key, entry);
                return entry.tex;
            }

            const entry = { tex: null, loading: true };
            tileCache.set(key, entry);

            if (tileCache.size > maxCache) {
                const oldestKey = tileCache.keys().next().value;
                const oldest = tileCache.get(oldestKey);
                if (oldest && oldest.tex) gl.deleteTexture(oldest.tex);
                tileCache.delete(oldestKey);
            }

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                const tex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
                entry.tex = tex;
                entry.loading = false;
                mapInstance.triggerRepaint();
            };
            img.onerror = () => {
                entry.loading = false;
            };
            img.src = `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
            return null;
        }

        let program = null;
        let vertexBuffer = null;
        let mapRef = null;

        return {
            id: 'osm-outside-masked',
            type: 'custom',
            onAdd(mapInstance, gl) {
                mapRef = mapInstance;
                const vs = `
                    attribute vec2 a_pos;
                    uniform mat4 u_matrix;
                    varying vec2 v_merc;
                    void main() {
                        v_merc = a_pos;
                        gl_Position = u_matrix * vec4(a_pos, 0.0, 1.0);
                    }
                `;
                const fs = `
                    precision highp float;
                    varying vec2 v_merc;
                    uniform sampler2D u_tile;
                    uniform vec2 u_tile_min;
                    uniform float u_tile_size;
                    uniform float u_saturation;
                    uniform float u_min_tone;
                    uniform float u_max_tone;

                    void main() {
                        vec2 uv = (v_merc - u_tile_min) / u_tile_size;
                        if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) discard;
                        
                        vec4 color = texture2D(u_tile, uv);
                        float gray = dot(color.rgb, vec3(0.299, 0.587, 0.114));
                        vec3 satColor = mix(vec3(gray), color.rgb, u_saturation);
                        vec3 finalColor = mix(vec3(u_min_tone), vec3(u_max_tone), satColor);
                        
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `;

                const vShader = gl.createShader(gl.VERTEX_SHADER);
                gl.shaderSource(vShader, vs);
                gl.compileShader(vShader);

                const fShader = gl.createShader(gl.FRAGMENT_SHADER);
                gl.shaderSource(fShader, fs);
                gl.compileShader(fShader);

                program = gl.createProgram();
                gl.attachShader(program, vShader);
                gl.attachShader(program, fShader);
                gl.linkProgram(program);

                vertexBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
            },
            render(gl, matrix) {
                if (!program || !vertexBuffer || !mapRef) return;

                const z = Math.max(0, Math.min(19, Math.round(mapRef.getZoom() + 1)));
                const numTiles = Math.pow(2, z);
                const tileSize = 1.0 / numTiles;

                const bounds = mapRef.getBounds();
                const nw = maplibregl.MercatorCoordinate.fromLngLat(bounds.getNorthWest());
                const se = maplibregl.MercatorCoordinate.fromLngLat(bounds.getSouthEast());

                const minX = Math.max(0, Math.floor(nw.x * numTiles));
                const maxX = Math.min(numTiles - 1, Math.floor(se.x * numTiles));
                const minY = Math.max(0, Math.floor(nw.y * numTiles));
                const maxY = Math.min(numTiles - 1, Math.floor(se.y * numTiles));

                gl.useProgram(program);
                gl.disable(gl.DEPTH_TEST);
                gl.disable(gl.STENCIL_TEST);
                gl.disable(gl.BLEND);

                const posLoc = gl.getAttribLocation(program, 'a_pos');
                const matLoc = gl.getUniformLocation(program, 'u_matrix');
                const tileLoc = gl.getUniformLocation(program, 'u_tile');
                const minLoc = gl.getUniformLocation(program, 'u_tile_min');
                const sizeLoc = gl.getUniformLocation(program, 'u_tile_size');
                const satLoc = gl.getUniformLocation(program, 'u_saturation');
                const minToneLoc = gl.getUniformLocation(program, 'u_min_tone');
                const maxToneLoc = gl.getUniformLocation(program, 'u_max_tone');

                gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
                gl.enableVertexAttribArray(posLoc);
                gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

                const satVal = appSettings.saturation / 100.0;
                const maxToneVal = Math.max(0.05, 1.0 - (appSettings.darkness / 100.0));
                const minToneVal = Math.min(maxToneVal, appSettings.shadowFloor / 100.0);

                gl.uniformMatrix4fv(matLoc, false, matrix);
                gl.uniform1f(sizeLoc, tileSize);
                gl.uniform1f(satLoc, satVal);
                gl.uniform1f(minToneLoc, minToneVal);
                gl.uniform1f(maxToneLoc, maxToneVal);
                gl.uniform1i(tileLoc, 0);
                gl.activeTexture(gl.TEXTURE0);

                const vertexCount = vertices.length / 2;

                for (let tx = minX; tx <= maxX; tx++) {
                    for (let ty = minY; ty <= maxY; ty++) {
                        const tex = getTileTexture(gl, mapRef, z, tx, ty);
                        if (!tex) continue;
                        gl.bindTexture(gl.TEXTURE_2D, tex);
                        gl.uniform2f(minLoc, tx * tileSize, ty * tileSize);
                        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
                    }
                }
            }
        };
    }

    /* ================= МАРКЕРЫ НАСЕЛЁННЫХ ПУНКТОВ ================= */
    const markers = [];

    function updateMarkersVisibility() {
        const currentZoom = map.getZoom();
        const bounds = map.getBounds();

        markers.forEach(item => {
            if (!appSettings.showLabels) {
                item.element.style.opacity = '0';
                item.element.classList.add('marker-hidden');
                return;
            }

            const isInBounds = bounds.contains(item.lngLat);
            const isZoomValid = currentZoom >= item.minZoom;

            if (isZoomValid && isInBounds) {
                if (item.element.classList.contains('marker-hidden')) {
                    item.element.classList.remove('marker-hidden');
                    void item.element.offsetWidth;
                }
                item.element.style.opacity = '1';
            } else {
                item.element.style.opacity = '0';
                item.element.classList.add('marker-hidden');
            }
        });
    }

    let visibilityTimeout;
    function scheduleVisibilityUpdate() {
        clearTimeout(visibilityTimeout);
        visibilityTimeout = setTimeout(updateMarkersVisibility, 30);
    }

    map.on('move', scheduleVisibilityUpdate);
    map.on('zoom', scheduleVisibilityUpdate);
    map.on('pitchend', scheduleVisibilityUpdate);
    map.on('rotate', scheduleVisibilityUpdate);

    function createMarkers(places) {
        places.forEach(place => {
            if (!place || !Array.isArray(place.coords) || place.coords.length !== 2 ||
                typeof place.coords[0] !== 'number' || typeof place.coords[1] !== 'number') {
                return;
            }

            const wrapper = document.createElement('div');
            const label = document.createElement('span');
            label.className = `map-label style-${place.type}`;
            label.textContent = place.name;
            label.setAttribute('data-shadow', place.name);

            if (place.dot) {
                wrapper.className = 'marker-with-dot';
                const dot = document.createElement('div');
                dot.className = 'custom-dot';
                wrapper.appendChild(dot);
                wrapper.appendChild(label);
            } else {
                wrapper.className = 'marker-center';
                wrapper.appendChild(label);
            }

            const lngLat = { lng: place.coords[0], lat: place.coords[1] };

            const marker = new maplibregl.Marker({ element: wrapper, anchor: 'top-left' })
                .setLngLat(lngLat)
                .addTo(map);

            markers.push({
                marker: marker,
                element: wrapper,
                labelEl: label,
                lngLat: lngLat,
                minZoom: typeof place.minZoom === 'number' ? place.minZoom : 0,

    /* ================= СПАВН И УПРАВЛЕНИЕ ОБЪЕКТАМИ ================= */

    function updateUnitsCounter() {

    function removeSpawnedUnit(unitObj) {
        const idx = spawnedUnits.indexOf(unitObj);
        if (idx !== -1) {
            unitObj.marker.remove();
            spawnedUnits.splice(idx, 1);
            if (hoveredUnit === unitObj) hoveredUnit = null;

    function spawnUnitOnMap(item) {
        const center = map.getCenter();
        const angleStep = (spawnCountOffset * 45) * (Math.PI / 180);
        const radiusPx = (spawnCountOffset % 6) * 14;
        spawnCountOffset++;

        const centerPx = map.project(center);
        const targetLngLat = map.unproject([
            centerPx.x + Math.cos(angleStep) * radiusPx,
            centerPx.y + Math.sin(angleStep) * radiusPx
        ]);

        const wrapper = document.createElement('div');
        wrapper.className = 'spawned-unit';

        const img = document.createElement('img');
        img.src = `./icons/${item.file}`;
        img.alt = item.label;
        img.style.width = `${appSettings.unitSize}px`;
        img.style.height = 'auto';

        const badge = document.createElement('div');
        badge.className = 'spawned-angle-badge';
        badge.textContent = '0°';

        wrapper.appendChild(img);
        wrapper.appendChild(badge);

        const marker = new maplibregl.Marker({
            element: wrapper,
            anchor: 'top-left'
        })
            .setLngLat(targetLngLat)
            .addTo(map);

        const unitObj = {
            id: Date.now() + Math.random(),
            file: item.file,
            label: item.label,
            img: img,
            wrapper: wrapper,
            badge: badge,
            marker: marker,
            angle: 0
        };

        wrapper.addEventListener('mouseenter', () => { hoveredUnit = unitObj; });
        wrapper.addEventListener('mouseleave', () => { if (hoveredUnit === unitObj) hoveredUnit = null; });

        let isDragging = false;
        let dragStartMouse = null;
        let dragStartLngLat = null;

        img.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            e.stopPropagation();
            e.preventDefault();
            isDragging = true;
            dragStartMouse = { x: e.clientX, y: e.clientY };
            dragStartLngLat = marker.getLngLat();
            map.dragPan.disable();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const startPx = map.project(dragStartLngLat);
            const dx = e.clientX - dragStartMouse.x;
            const dy = e.clientY - dragStartMouse.y;
            const newLngLat = map.unproject([startPx.x + dx, startPx.y + dy]);
            marker.setLngLat(newLngLat);
        });

        window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            map.dragPan.enable();
        });

        let badgeTimer = null;
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            e.stopPropagation();

            const step = e.shiftKey ? 1 : 5;
            const dir = e.deltaY > 0 ? 1 : -1;
            unitObj.angle = (unitObj.angle + dir * step + 360) % 360;

            img.style.transform = `translate(-50%, -50%) rotate(${unitObj.angle}deg)`;
            badge.textContent = `${Math.round(unitObj.angle)}°`;
            wrapper.classList.add('rotating');

            clearTimeout(badgeTimer);
            badgeTimer = setTimeout(() => {
                wrapper.classList.remove('rotating');
            }, 650);
        }, { passive: false });

        wrapper.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            removeSpawnedUnit(unitObj);
        });

        spawnedUnits.push(unitObj);
        updateUnitsCounter();
    }

    function startSnippingMode() {

    openSnipBtn.addEventListener('click', startSnippingMode);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isSnippingMode) {
            stopSnippingMode();
        }
        if ((e.altKey && (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы')) || e.key === 'PrintScreen') {
            e.preventDefault();
            startSnippingMode();
        }
    });

    snipOverlay.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
            stopSnippingMode();
            return;
        }
        if (e.button !== 0) return;

        isSelectingRect = true;
        snipStart = { x: e.clientX, y: e.clientY };
        snipRect = { x: e.clientX, y: e.clientY, w: 0, h: 0 };

        snipFullDim.style.display = 'none';
        snipSelectionBox.style.display = 'block';
        snipSelectionBox.style.left = `${e.clientX}px`;
        snipSelectionBox.style.top = `${e.clientY}px`;
        snipSelectionBox.style.width = '0px';
        snipSelectionBox.style.height = '0px';
    });

    snipOverlay.addEventListener('mousemove', (e) => {
        if (!isSelectingRect) return;

        const x = Math.min(snipStart.x, e.clientX);
        const y = Math.min(snipStart.y, e.clientY);
        const w = Math.abs(e.clientX - snipStart.x);
        const h = Math.abs(e.clientY - snipStart.y);
        snipRect = { x, y, w, h };

        snipSelectionBox.style.left = `${x}px`;
        snipSelectionBox.style.top = `${y}px`;
        snipSelectionBox.style.width = `${w}px`;
        snipSelectionBox.style.height = `${h}px`;

        if (w > 10 && h > 10) {
            snipSizeBadge.style.display = 'block';
            snipSizeBadge.textContent = `${Math.round(w)} × ${Math.round(h)}`;
            snipSizeBadge.style.left = `${Math.min(window.innerWidth - 90, x)}px`;
            snipSizeBadge.style.top = `${Math.max(8, y - 26)}px`;
        }
    });

    snipOverlay.addEventListener('mouseup', async (e) => {
        if (!isSelectingRect) return;
        const rect = { ...snipRect };
        stopSnippingMode();

        if (rect.w < 12 || rect.h < 12) return;

        try {
            await captureAreaToClipboard4K(rect);
        } catch (err) {
            console.error('Ошибка создания скриншота:', err);

    // Вспомогательная функция отрисовки текста с точным letterSpacing как в CSS
    function drawTrackedText(ctx, text, x, y, letterSpacingPx) {
        if (!letterSpacingPx || letterSpacingPx === 0) {
            ctx.fillText(text, x, y);
            return;
        }
        const chars = Array.from(text);
        let totalWidth = 0;
        for (let i = 0; i < chars.length; i++) {
            totalWidth += ctx.measureText(chars[i]).width + (i < chars.length - 1 ? letterSpacingPx : 0);
        }

        let currentX = x;
        if (ctx.textAlign === 'center') {
            currentX = x - totalWidth / 2;
        } else if (ctx.textAlign === 'right') {
            currentX = x - totalWidth;
        }

        const prevAlign = ctx.textAlign;
        ctx.textAlign = 'left';
        for (let i = 0; i < chars.length; i++) {
            ctx.fillText(chars[i], currentX, y);
            currentX += ctx.measureText(chars[i]).width + letterSpacingPx;
        }
        ctx.textAlign = prevAlign;
    }

    async function captureAreaToClipboard4K(rect) {
        showToast('Рендер в 4K...');

        // Гарантируем, что шрифт CustomArial полностью загружен перед отрисовкой на Canvas
        if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
        }
        updateMarkersVisibility();

        map.triggerRepaint();
        await new Promise(resolve => map.once('render', resolve));

        const mapCanvas = map.getCanvas();
        const cssWidth = mapCanvas.clientWidth;
        const cssHeight = mapCanvas.clientHeight;

        const maxSide = Math.max(rect.w, rect.h);
        const target4kScale = Math.max(2, Math.min(4, 3840 / maxSide));

        const outCanvas = document.createElement('canvas');
        outCanvas.width = Math.round(rect.w * target4kScale);
        outCanvas.height = Math.round(rect.h * target4kScale);

        const ctx = outCanvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        // 1. Подложка карты из WebGL Canvas
        const canvasScaleX = mapCanvas.width / cssWidth;
        const canvasScaleY = mapCanvas.height / cssHeight;

        ctx.drawImage(
            mapCanvas,
            rect.x * canvasScaleX,
            rect.y * canvasScaleY,
            rect.w * canvasScaleX,
            rect.h * canvasScaleY,
            0,
            0,
            outCanvas.width,
            outCanvas.height
        );

        ctx.save();
        ctx.scale(target4kScale, target4kScale);
        ctx.translate(-rect.x, -rect.y);

        // 2. Рисуем ТОЛЬКО реально видимые на экране подписи НП с их точными CSS-параметрами
        if (appSettings.showLabels) {
            markers.forEach(item => {
                if (item.element.classList.contains('marker-hidden')) return;

                const pos = map.project(item.lngLat);
                if (pos.x < rect.x - 160 || pos.x > rect.x + rect.w + 160 ||
                    pos.y < rect.y - 60 || pos.y > rect.y + rect.h + 60) {
                    return;
                }

                const p = item.place;
                const computed = window.getComputedStyle(item.labelEl);

                // Точка города/села (4px с белой обводкой 1px)
                if (p.dot) {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#333333';
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                }

                const fontWeight = computed.fontWeight || '400';
                const fontSize = computed.fontSize || '10px';
                const fontFamily = computed.fontFamily || 'CustomArial, Arial, sans-serif';
                const color = computed.color || '#2b2b2b';
                const letterSpacing = parseFloat(computed.letterSpacing) || 0;
                const text = p.type === 'obl' ? p.name.toUpperCase() : p.name;

                ctx.font = `${fontWeight} ${fontSize} ${fontFamily}`;
                ctx.textBaseline = p.dot ? 'top' : 'middle';
                ctx.textAlign = p.dot ? 'left' : 'center';

                const textX = p.dot ? pos.x + 6 : pos.x;
                const textY = p.dot ? pos.y + 4 : pos.y;

                // Белая тень текста (смещение 1.5px, 1.5px как в CSS ::after)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                drawTrackedText(ctx, text, textX + 1.5, textY + 1.5, letterSpacing);

                // Основной текст
                ctx.fillStyle = color;
                drawTrackedText(ctx, text, textX, textY, letterSpacing);
            });
        }

        spawnedUnits.forEach(unit => {
            const pos = map.project(unit.marker.getLngLat());
            const img = unit.img;
            if (!img.complete || img.naturalWidth === 0) return;

            const drawW = appSettings.unitSize;
            const aspect = img.naturalHeight / img.naturalWidth;
            const drawH = drawW * aspect;

            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate((unit.angle * Math.PI) / 180);

            if (appSettings.unitOutline) {
                const pad = 4;
                const tmp = document.createElement('canvas');
                tmp.width = Math.ceil((drawW + pad * 2) * target4kScale);
                tmp.height = Math.ceil((drawH + pad * 2) * target4kScale);
                const tctx = tmp.getContext('2d');
                tctx.scale(target4kScale, target4kScale);

                const cx = pad;
                const cy = pad;
                const d = 0.6;

                tctx.save();
                tctx.filter = 'brightness(0) invert(1)';
                const offsets = [
                    [d, 0], [-d, 0], [0, d], [0, -d],
                    [d * 0.7, d * 0.7], [-d * 0.7, -d * 0.7]
                ];
                for (const [ox, oy] of offsets) {
                    tctx.drawImage(img, cx + ox, cy + oy, drawW, drawH);
                }
                tctx.restore();
                tctx.drawImage(img, cx, cy, drawW, drawH);

                ctx.shadowColor = 'rgba(255, 255, 255, 0.35)';
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 1;
                ctx.drawImage(tmp, -drawW / 2 - pad, -drawH / 2 - pad, drawW + pad * 2, drawH + pad * 2);
            } else {
                ctx.shadowColor = 'rgba(255, 255, 255, 0.35)';
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 1;
                ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
            }

            ctx.restore();
        });

        ctx.restore();

        // 4. Копируем готовый PNG в буфер обмена
        const blob = await new Promise(resolve => outCanvas.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('Не удалось сформировать PNG');

        await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
        ]);

        showToast(`Скопировано в буфер (${outCanvas.width}×${outCanvas.height})`);
    }

    /* ================= ПРИМЕНЕНИЕ НАСТРОЕК К КАРТЕ И UI ================= */
    function applyAllSettingsToMap() {
        if (map && map.triggerRepaint) {
            map.triggerRepaint();
        }

        // Обновляем размер всех заспавненных объектов
        spawnedUnits.forEach(u => {
            u.img.style.width = `${appSettings.unitSize}px`;
        });

        // Включаем/выключаем класс белой обводки БПЛА
        if (appSettings.unitOutline) {
            document.body.classList.add('unit-outline-enabled');
        } else {
            document.body.classList.remove('unit-outline-enabled');
        }

        // Прозрачность границ
        const factor = appSettings.bordersOpacity / 100;
        Object.entries(BORDER_BASE_OPACITY).forEach(([layerId, baseOp]) => {
            if (map.getLayer(layerId)) {
                map.setPaintProperty(layerId, 'line-opacity', baseOp * factor);
            }
        });

        // Леса и застройка
        const landcoverVis = appSettings.showLandcover ? 'visible' : 'none';
        ['forest-fill', 'forest-outline', 'forest-points', 'towns-fill', 'towns-outline', 'towns-points'].forEach(layerId => {
            if (map.getLayer(layerId)) {
                map.setLayoutProperty(layerId, 'visibility', landcoverVis);
            }
        });

        // Подписи НП
        updateMarkersVisibility();
    }

        valUnitSize.textContent = `${appSettings.unitSize} px`;
        saveSettings(appSettings);
        applyAllSettingsToMap();
    });

    ctrlUnitOutline.addEventListener('change', (e) => {
        appSettings.unitOutline = e.target.checked;
        saveSettings(appSettings);
        applyAllSettingsToMap();
    });

    ctrlBorders.addEventListener('input', (e) => {
        appSettings.bordersOpacity = Number(e.target.value);
        valBorders.textContent = `${appSettings.bordersOpacity}%`;
        saveSettings(appSettings);
        applyAllSettingsToMap();
    });

    ctrlLabels.addEventListener('change', (e) => {
        appSettings.showLabels = e.target.checked;
        saveSettings(appSettings);
        applyAllSettingsToMap();
    });

    ctrlLandcover.addEventListener('change', (e) => {
        appSettings.showLandcover = e.target.checked;
        saveSettings(appSettings);
        applyAllSettingsToMap();
    });

    resetBtn.addEventListener('click', () => {
        appSettings = { ...DEFAULT_SETTINGS };
        saveSettings(appSettings);
        syncUiWithSettings();
        applyAllSettingsToMap();
    });

    syncUiWithSettings();
    applyAllSettingsToMap();
</script>

</body>
</html>
